{{define "login.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in</title>
  <style>
    :root { --bg:#0b1020; --panel:#151d38; --border:#243156; --text:#e7ecf7; --muted:#9aa7c7; --brand:#5b8cff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:36px 32px; width:340px;
            box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .logo { width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,#5b8cff,#8a6cff); margin-bottom:18px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
    label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:14px 0 6px; }
    input { width:100%; background:#0a0f1f; border:1px solid var(--border); border-radius:8px; padding:11px 13px;
            color:var(--text); font-size:14px; }
    input:focus { outline:none; border-color:var(--brand); }
    button { width:100%; margin-top:22px; background:var(--brand); color:#fff; border:0; border-radius:8px;
             padding:12px; font-weight:600; font-size:14px; cursor:pointer; }
    button:hover { background:#4878e6; }
    .err { background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.4); color:#ff9b9b;
           border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:18px; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="{{.Base}}/login" autocomplete="off">
    <div class="logo"></div>
    <h1>Console access</h1>
    <p class="sub">Authorized personnel only.</p>
    {{if .Error}}<div class="err">Invalid username or password.</div>{{end}}
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autofocus />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>{{end}}
